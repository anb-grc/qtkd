<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TÊN MÔN HỌC</title>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="page-header">
    <div style="font-size: 0.55em; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px;">Quản Trị Kinh Doanh</div>
    <h1><em>[TÊN MÔN HỌC]</em></h1>
    <p class="stats" id="totalCount">Tổng: <span>0 câu</span></p>
    <p class="instruction" id="mode-instruction">Trắc nghiệm: Đọc → Tự nghĩ → CLICK để kiểm tra <br> Tự luận: Đọc → Tự viết → CLICK xem gợi ý</p>
  </div>
  <div class="mode-switch">
    <button id="btnKnowledgeMode" onclick="switchMode('knowledge')">Kiến thức nền</button>
    <button id="btnStudyMode" class="active" onclick="switchMode('study')">Ngân hàng đề</button>
    <button id="btnQuizMode" onclick="switchMode('quiz')">Thi Thử</button>
    <button id="btnHistory" onclick="renderHistory()" style="background:var(--warn); color:#0f0f1a; margin-left:10px; border:1px solid var(--warn); font-weight:700;">Lịch sử</button>
  </div>

  <div id="quiz-result-summary"></div>
  <div id="quiz-container">
    <div id="quiz-content"></div>
  </div>

  <div id="knowledge-container">
    <!-- NỘI DUNG KIẾN THỨC NỀN SẼ ĐƯỢC NHÚNG VÀO ĐÂY -->
    <div id="knowledge-content"></div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchBox" placeholder="Nhập từ khóa để tìm nhanh..." oninput="filterQuestions()" />
    <button id="clearBtn" onclick="clearSearch()">✕ Xóa</button>
  </div>
  <div id="searchMeta"></div>
  <div id="noResult">Không tìm thấy câu hỏi nào phù hợp.</div>

  <div id="questions-list">
    <!-- CÁC CÂU HỎI SẼ ĐƯỢC CHÈN VÀO ĐÂY -->
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <!-- Thư viện MathJax để hiển thị công thức toán học -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    const QS_DATA_URL = 'TEN_MON_HOC_qs.json';
    
    // Cấu hình riêng cho môn học này (dùng cho chế độ Luyện Cấu Trúc)
    window.subjectConfig = {
      quizTotal: 40, // Tổng số câu hỏi trong 1 đề thi
      structure: [
        // Mở comment và sửa lại theo cấu trúc đề thi thực tế. Nếu bỏ trống, hệ thống sẽ bốc ngẫu nhiên.
        // { tag: "Chương 1", count: 10 },
        // { tag: "Chương 2", count: 15 },
        // { tag: "Bài tập", count: 15 }
      ]
    };
  </script>
  <script src="../assets/app.js?1784261156"></script>

  <!-- MODAL LỊCH SỬ (Đã đồng bộ Dark Mode / Glassmorphism) -->
  <div id="history-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
    <div style="background: var(--surface); color: var(--text); border: 1px solid var(--border); width: 90%; max-width: 420px; padding: 24px; border-radius: 16px; box-shadow: var(--shadow-md); position: relative;">
      <button onclick="closeHistory()" style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted);">&times;</button>
      <div id="history-content"></div>
    </div>
  </div>

</body>
</html>
